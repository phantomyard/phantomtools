# Minimal org-agnostic base manifest for the derive smoke test.
# The shipped examples/ base is org-specific (telegram_bots, card branding);
# the smoke fixture org has different personas, so derive+validate here must
# use a neutral base.

org: smoke-org
language: es
version: 0.0.0

bridge:
  relay: ws://example.invalid:7777
  npub: npub1placeholderplaceholderplaceholderplaceholderplaceholderplace

rooms:
  suffix: "@conference.example.invalid"
  naming: "{DD-MM-YYYY}-{HH-MM}_{topic}"
  active_room_required: true

storage:
  recordings_dir: /var/recordings
  drive_folder: Grabaciones
  custodian: maria
  meeting_folders:
    almaponia: "01_REUNIONES_GO"
  decided_by: responsible
  cleanup_after_confirm: true

kb_appendix:
  - |-
    ## Custodia (flujo post-reunión)

    4. {% if destination_owner %}**{{ destination_owner }}** sube el MP4, la transcripción y el resumen a Google Drive → carpeta `{{ destination_folder }}/` ({{ destination_note }}).{% if destination_custodian %} Si {{ destination_owner }} no puede, lo hace **{{ destination_custodian }}** (custodia de la organización).{% endif %}{% else %}La persona responsable sube el MP4, la transcripción y el resumen a Google Drive (la carpeta destino la indica la solicitud).{% endif %}

defaults:
  title: reunion
  time: "18:00"
  duration_min: 60
  recipients: []
  sensitive: false

invite:
  phantombot_bin: phantombot
  coordinator_chat: "@coordinacion"
  meet_base_url: https://meet.example.invalid
  send_via: phantombot-notify
  tool:
    template: tools/meeting-invite.sh.j2
    dest: tools/meeting-invite.sh
    chmod: 0o755

derive:
  directive_roles: [ceo, cfo]
  scoped_responsible_roles:
    project_lead: almaponia
  support_roles: [training_lead]
  restricted_prefixes:
    training_lead: formacion

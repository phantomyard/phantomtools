name: Phantom policy
on:
  pull_request:
  push:
    branches: [main]
permissions:
  contents: read
jobs:
  contract-verifier:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: '3.12'
      - run: python -m pip install -r phantom-policy/requirements-dev.txt
      - run: ruff check phantom-policy
      - run: ruff format --check phantom-policy
      - run: python -m pytest phantom-policy/tests -q

name: ci

on:
  push:
    branches: [main]
    paths: ["phantombridge/**", ".github/workflows/phantombridge-ci.yml"]
  pull_request:
    paths: ["phantombridge/**", ".github/workflows/phantombridge-ci.yml"]

permissions:
  contents: read

defaults:
  run:
    working-directory: phantombridge

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        node: [20, 22, 24]
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: ${{ matrix.node }}
          cache: npm
          cache-dependency-path: phantombridge/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Syntax check
        run: |
          node --check bridge.js
          node --check org-routing.js
          node --check secrets.js
          node --check mcp-bridge.mjs
          for f in test-*.js; do node --check "$f"; done

      - name: Run tests (unit, no network)
        run: npm test

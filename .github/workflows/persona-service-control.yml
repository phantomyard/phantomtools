name: Persona service control
on:
  push:
    branches: [main]
    paths: [persona-service-control/**, .github/workflows/persona-service-control.yml]
  pull_request:
    paths: [persona-service-control/**, .github/workflows/persona-service-control.yml]
permissions:
  contents: read
jobs:
  check:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python: ['3.10', '3.12']
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: ${{ matrix.python }}
      - run: python -m pip install ruff==0.16.2 bandit==1.9.4
      - run: ruff check --isolated --select E4,E7,E9,F,I,B persona-service-control
      - run: ruff format --isolated --check persona-service-control
      - run: bandit -q persona-service-control/persona_service_control.py
      - run: python -m unittest discover -s persona-service-control/tests -v
      - name: Test actual root-owned configuration files without installing anything
        run: sudo -n "$(command -v python)" -I -m unittest discover -s persona-service-control/tests -p test_trusted_config.py -v
      - name: Verify rendered units without loading or starting them
        shell: bash
        run: |
          python - <<'PY'
          import importlib.util, pathlib, sys, tempfile
          spec = importlib.util.spec_from_file_location('control', 'persona-service-control/persona_service_control.py')
          control = importlib.util.module_from_spec(spec)
          sys.modules[spec.name] = control
          spec.loader.exec_module(control)
          binding = control.parse_binding({'version': 1, 'id': 'example', 'account': 'nobody', 'uid': 65534, 'unit': 'example.service'})
          directory = pathlib.Path(tempfile.mkdtemp(prefix='psc-units-'))
          for name, content in control.render_units(binding).items():
              (directory / name).write_text(content)
          pathlib.Path('psc-unit-directory.txt').write_text(str(directory))
          PY
          directory="$(cat psc-unit-directory.txt)"
          systemd-analyze verify "$directory"/*.socket "$directory"/*.service

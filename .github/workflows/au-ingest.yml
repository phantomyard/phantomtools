name: AU ingest regression
on:
  push:
    branches: [main]
    paths:
      - 'phantomdocs/**'
      - '.github/workflows/au-ingest.yml'
  pull_request:
    branches: [main]
    paths:
      - 'phantomdocs/**'
      - '.github/workflows/au-ingest.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  regression:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.12'
      - run: python -m pip install './phantomdocs[dev]' ruff==0.16.2
      - run: ruff check --config phantomdocs/pyproject.toml phantomdocs/contrib/au/ingest_bandejas.py phantomdocs/tests/test_au_ingest.py
      - run: ruff format --check --config phantomdocs/pyproject.toml phantomdocs/contrib/au/ingest_bandejas.py phantomdocs/tests/test_au_ingest.py
      - run: python -m pytest phantomdocs/tests/test_au_ingest.py phantomdocs/tests/test_reference.py phantomdocs/tests/test_access.py phantomdocs/tests/test_setup.py -q

name: PhantomOrg service policy

on:
  push:
    branches: [main]
    paths: [phantomorg/**, .github/workflows/phantomorg-service-policy.yml]
  pull_request:
    paths: [phantomorg/**, .github/workflows/phantomorg-service-policy.yml]

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python: ['3.10', '3.12']
    defaults:
      run:
        working-directory: phantomorg
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: ${{ matrix.python }}
      - run: python -m pip install -e '.[dev]' ruff==0.16.2 bandit==1.9.4 mypy
      - run: ruff check phantomorg tests
      - run: ruff format --check phantomorg tests
      - run: bandit -r phantomorg -q
      # Match the existing CI's typing target; Python 3.10 runtime fallback
      # imports for tomllib are exercised by the complete test suite below.
      - name: Type check (Python 3.12)
        if: matrix.python == '3.12'
        run: mypy phantomorg
      - run: python -m pytest -q

name: PhantomBlog
on:
  pull_request:
    paths: ["phantomblog/**", ".github/workflows/phantomblog-ci.yml"]
  push:
    branches: [main]
    paths: ["phantomblog/**", ".github/workflows/phantomblog-ci.yml"]
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: phantomblog
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - name: Set up Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: '3.11'
      - name: Install test and signed-access dependencies
        run: python -m pip install ".[dev]"
      - name: Lint and formatting
        run: |
          python -m ruff check .
          python -m ruff format --check phantomblog tests
      - name: Dashboard and publisher tests
        run: python -m pytest tests -q
      - name: Python and browser source syntax
        run: |
          python -m compileall -q phantomblog
          node --check phantomblog/resources/dashboard.js

name: CI

# Required status check for branch protection on `main`.
# The job name `pipeline` matches the phantomyard org convention so the
# standard branch-protection ruleset (`contexts: ["pipeline"]`) applies.

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  pipeline:
    name: pipeline
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: twilio-voice-agent
    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: Set up Node
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: '20'
          cache: npm
          cache-dependency-path: twilio-voice-agent/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Syntax check
        run: node --check server.js

      - name: Syntax check (email-triage Python)
        working-directory: email-triage
        run: python3 -m py_compile inbox-poll.py inbox-mail.py

      - name: Unit tests (email-triage)
        working-directory: email-triage
        run: python3 -m unittest test_inbox -v

      - name: Syntax check (bot-inbox Python)
        working-directory: bot-inbox
        run: python3 -m py_compile bin/bot-inbox

      - name: Unit tests (bot-inbox)
        working-directory: bot-inbox
        run: |
          python3 -m pip install --quiet pytest
          python3 -m pytest tests -v

      - name: Syntax check (github-app-auth)
        working-directory: github-app-auth
        run: |
          bash -n bin/git bin/git-pull-as-app bin/gh \
            bin/git-credential-github-app bin/github-token.sh \
            bin/refresh-github-env.sh install.sh uninstall.sh
          python3 -m py_compile bin/ghapplib.py bin/github-app-auth \
            bin/git-push-as-app bin/git-fetch-as-app bin/git-clone-as-app \
            bin/create-pr-as-app bin/list-repos-as-app

      - name: Unit tests (github-app-auth, Python)
        working-directory: github-app-auth
        run: python3 -m unittest discover -s tests -p 'test_*.py' -v

      - name: Wrapper tests (github-app-auth, shell)
        working-directory: ${{ github.workspace }}
        run: |
          bash github-app-auth/tests/test_wrapper.sh
          bash github-app-auth/tests/test_guard_check.sh
          bash github-app-auth/tests/test_clone_wrapper.sh
          bash github-app-auth/tests/test_gh_wrapper.sh

      - name: Lint (phantomdocs)
        working-directory: phantomdocs
        run: |
          python3 -m pip install --quiet ruff==0.16.2 bandit==1.9.4
          ruff check src tests
          ruff format --check src tests
          bandit -r src -q

      - name: Unit tests (phantomdocs)
        working-directory: phantomdocs
        run: |
          python3 -m pip install --quiet ".[dev]"
          python3 -m pytest -q

      - name: Smoke test (phantomdocs)
        working-directory: phantomdocs
        run: |
          python3 -m pip install --quiet .
          cd /tmp && rm -rf pd-smoke && mkdir pd-smoke && cd pd-smoke
          cp "$GITHUB_WORKSPACE/phantomdocs/tests/fixtures/smoke-org.yaml" org.yaml
          sed -i "s/^  - id: marco/  - id: $(id -un)/" org.yaml
          pd init --org smoke --root .
          printf '# hello\n' > hello.md
          pd add hello.md --slug hello.md --category 1 --owners ceo --root . --org-yaml org.yaml
          pd verify --root . | grep -q "verified 1 node" \
            && echo "SMOKE OK: init + add + verify"

  phantomorg:
    name: phantomorg
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: phantomorg
    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: Set up Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: '3.12'

      - name: Install dependencies (editable + dev)
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]" ruff==0.16.2 bandit==1.9.4 mypy

      - name: Ruff check (lint + style)
        run: ruff check phantomorg tests

      - name: Ruff format check
        run: ruff format --check phantomorg tests

      - name: Bandit (security)
        run: bandit -r phantomorg -q

      - name: mypy
        run: mypy phantomorg

      - name: Run tests
        run: python -m pytest -q

      - name: Smoke test — packaged install must build an org end to end
        run: |
          cd /tmp
          po new-org --id smoke --name "Smoke Org" --sector ngo --lang en --template ngo
          po add-department --org organizations/smoke/org.yaml --id ops --name Operations --access-policy level-2
          po add-role --org organizations/smoke/org.yaml --id lead --name "Team Lead" --department ops --access-level level-2
          po add-actor --org organizations/smoke/org.yaml --id maria --role lead --tool email
          po validate --org organizations/smoke/org.yaml
          po build --org organizations/smoke/org.yaml --out /tmp/smoke-dist
          find /tmp/smoke-dist -name SOUL.md | grep -q . && echo "SMOKE OK: SOUL.md generated"

  phantommeet:
    name: phantommeet
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: phantommeet
    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: Set up Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: '3.12'

      - name: Install dependencies (editable + dev)
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]" ruff==0.16.2 bandit==1.9.4

      - name: Ruff check (lint + style)
        run: ruff check src tests

      - name: Ruff format check
        run: ruff format --check src tests

      - name: Bandit (security)
        run: bandit -r src -q

      - name: Run tests
        run: python -m pytest -q

      - name: Smoke test — packaged install must derive + validate a manifest
        run: |
          cd /tmp
          pm derive-manifest \
            --org "$GITHUB_WORKSPACE/phantommeet/tests/fixtures/org.smoke.yaml" \
            --base "$GITHUB_WORKSPACE/phantommeet/tests/fixtures/base.smoke.yaml" \
            --out /tmp/smoke-derived.yaml
          pm validate --manifest /tmp/smoke-derived.yaml | grep -q "OK" \
            && echo "SMOKE OK: derive + validate"

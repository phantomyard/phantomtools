  - id: pepa
    role: chief_of_staff
    npub: npub15g9murn5rz3yh20c6wwkczv8ztn5trz8gfmulaxf8zt77fxatx5skz0vwt
    telegram_bot: "@PA_bot"
    tools: [email, drive, calendar]
    tools_excluded: [send]
    actor_exceptions: []

  - id: roberto
    role: cfo
    npub: npub1gthx35eejxlrkxc0faj7gpw5jy62hcw260g7ws95cq0x7hav58asyeuest
    telegram_bot: "@CFO_bot"
    tools: [email, drive, calendar, sheets]
    tools_excluded: []
    actor_exceptions: []

  - id: alma
    role: project_lead
    npub: npub10dkp4yu0tfmra36qx35xa4apj28np3acfsrqtf07xqtqs3sxlvlsg3zkmq
    telegram_bot: "@Alma_bot"
    tools: [email, drive, calendar, notebooklm]

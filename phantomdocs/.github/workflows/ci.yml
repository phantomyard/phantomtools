name: CI

# Required status check for branch protection on `main`.
# The job name `pipeline` matches the phantomyard org convention so the
# standard branch-protection ruleset (`contexts: ["pipeline"]`) applies.

on:
  pull_request:
  push:
    branches: [main]

defaults:
  run:
    working-directory: phantomdocs

jobs:
  lint:
    name: lint
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: '3.12'

      - name: Install ruff + bandit
        run: pip install ruff==0.16.2 bandit==1.9.4

      - name: Ruff check (lint + style)
        run: ruff check src tests

      - name: Ruff format check
        run: ruff format --check src tests

      - name: Bandit (security)
        run: bandit -r src -q

  pipeline:
    name: pipeline
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: '3.12'

      - name: Install dependencies (non-editable, as a real user would)
        run: |
          python -m pip install --upgrade pip
          pip install ".[dev]"

      - name: Run tests
        run: python -m pytest -v

      - name: Smoke test — init + add + verify round-trip
        run: |
          cd /tmp
          rm -rf pd-smoke && mkdir pd-smoke && cd pd-smoke
          pd init --org smoke --root .
          printf '# hello\n' > hello.md
          pd add hello.md --slug hello.md --category 1 --root .
          pd verify --root . | grep -q "verified 1 node" \
            && echo "SMOKE OK: init + add + verify"

[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "phantomdocs"
version = "0.3.0"
description = "Agnostic document management for PhantomOrg-provisioned agent personas."
requires-python = ">=3.10"
dependencies = [
    "PyYAML>=6.0",
    "click>=8.1",
    "coincurve>=18.0",
    "jsonschema>=4.18",
    "tomli>=2.0; python_version < '3.11'",
]

[project.scripts]
phantomdocs = "phantomdocs.cli:main"
pd = "phantomdocs.cli:main"

[project.optional-dependencies]
dev = ["pytest>=8.0"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
phantomdocs = ["workflow_assets/*.json", "workflow_assets/*.md"]

[tool.ruff.lint.isort]
known-first-party = ["phantomdocs"]

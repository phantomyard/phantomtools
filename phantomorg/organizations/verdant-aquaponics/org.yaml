version: 1

organization:
  id: verdant-aquaponics
  name: "Verdant Aquaponics Co-op"
  sector: ngo
  languages: [es, en]
  default_language: es

departments:
  - { id: direccion,   name: "Dirección",   parent: null,      access_policy: level-3 }
  - { id: operaciones, name: "Operaciones", parent: direccion, access_policy: level-2 }
  - { id: formacion,   name: "Formación",   parent: direccion, access_policy: level-2 }
  - { id: finanzas,    name: "Finanzas",    parent: direccion, access_policy: level-2 }

roles:
  - id: ceo
    name: "CEO"
    department: direccion
    reports_to: null
    reports_to_human: "Board President"
    functions: [vision, liderazgo, wikipedia_au, tools]
    access_level: level-3
    security_exceptions: []
    description: "Dirección general, estrategia, decisiones que afectan a toda la organización, relaciones con la presidencia (Board President). Contactar ante dudas sobre prioridades, conflictos entre departamentos, autorización de nuevas líneas de trabajo o cualquier cosa que nadie más pueda decidir."

  - id: chief_of_staff
    name: "Chief of Staff"
    department: direccion
    reports_to: ceo
    functions: [coordinacion, escalado, seguimiento]
    access_level: level-2
    security_exceptions: []
    description: "Coordinación de proyectos, comunicación, educación, alianzas, volunteers. Supervisa a Nora, Vera, Elias, Leda y Volunteers. Contactar ante problemas operativos en un departamento gestionado, necesidad de coordinación entre equipos o escalado de un issue."

  - id: cfo
    name: "CFO"
    department: finanzas
    reports_to: ceo
    functions: [finanzas, reporting]
    access_level: level-2
    security_exceptions: []
    description: "Presupuestos, facturación, tesorería, cash flow, informes financieros, viabilidad económica. Contactar para saber si hay presupuesto, aprobar un gasto, revisar liquidez o preparar un informe financiero."

  - id: project_lead
    name: "Project Lead"
    department: operaciones
    reports_to: chief_of_staff
    functions: [proyectos, seguimiento_campo]
    access_level: level-2
    security_exceptions: []
    description: "Proyecto Greenroot (GO Project). Coordinación del piloto, documentación, ejecución. Contactar para cualquier cosa relacionada con Greenroot."

  - id: training_lead
    name: "Training Lead"
    department: formacion
    reports_to: chief_of_staff
    functions: [formacion, documentacion]
    access_level: level-2
    security_exceptions: [category-3]
    description: "Talleres, cursos, material formativo, educación en acuaponía. Contactar para contenido formativo, organizar un taller o revisar material didáctico."


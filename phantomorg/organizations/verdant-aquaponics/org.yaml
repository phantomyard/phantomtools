humans:
  # Registry de humanos de la organización de ejemplo. Los IDs telegram/npub
  # son placeholders; actualizar con los reales al desplegar (y compilar con pf).
  - id: mar
    name: "Presidente de la organización"
    role: "Board President"
    telegram_user_id: 1000000001
    npub: null
  - id: julia
    name: "Secretaria de la organización"
    role: "Secretary"
    telegram_user_id: 1000000002
    npub: null
  - id: leo
    name: "Tesorero de la organización"
    role: "Treasurer"
    telegram_user_id: null
    npub: null
  - id: mirta
    name: "Coordinadora del proyecto piloto"
    role: "Greenroot Coordinator member"
    telegram_user_id: 1000000003
    npub: null

policies:
  access_levels:
    level-3: { label: "Ejecutivo", categories: [1, 2, 3] }
    level-2: { label: "Operativo", categories: [1, 2] }
    level-1: { label: "Restringido", categories: [1] }
  security_categories:
    category-0: { label: "Excepción absoluta", scope: actor, owner: "Board President" }
    category-1: { label: "Público / interno bajo" }
    category-2: { label: "Confidencial" }
    category-3: { label: "Credenciales / financiero sensible" }

escalation_matrix:
  - { from: project_lead,   to: chief_of_staff, condition: "bloqueo operativo o desacuerdo de campo",       cross_department: false }
  - { from: training_lead,  to: chief_of_staff, condition: "contenido fuera de alcance de formación",       cross_department: false }
  - { from: cfo,            to: ceo,            condition: "gasto por encima del umbral de política financiera", cross_department: false }
  - { from: chief_of_staff, to: ceo,            condition: "bloqueo no resuelto en su nivel",               cross_department: false }
  - { from: "*",            to: ceo,            condition: "excepción Category 0 solicitada",               cross_department: true }

communication:
  request_id_format: "{org_id}-{yyyymmdd}-{seq4}"
  message_types: [REQUEST, INFORM, ESCALATE, CONFIRM, REJECT]
  max_hops: 3
  norm_version: "1.5"
  envelope:
    marker: "[env]"
    ttl_hours: 6
  channels:
    human:
      platform: telegram
      group: "Coordinación"
      chat_id: "-1000000000001"
    agent:
      platform: phantomchat
      relay: "ws://relay.example.invalid:7777"
      # Puente PhantomBridge (v1.2.0): identidad nostr del puente y relays.
      bridge_npub: "npub1k5sucm83q6tg4a9qhz8vx6gu8m3x03ecnnr0klv6skzhv8elkfkstydrel"
      # Identidad nostr compartida del grupo humano (nora/vera/leda/volunteers).
      human_npubs:
        - "npub1cml4wlfllw6mmw8esxgtslnka3scdxek7ecvh6vej7rtdjvzzd0s0cum9v"
      # Relays públicos adicionales (el privado del org va siempre primero).
      public_relays:
        - "wss://relay.damus.io"
        - "wss://nos.lol"
        - "wss://relay.primal.net"
        - "wss://nostr.mom"
        - "wss://nostr.data.haus"
